version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    groups:
      python-dependencies:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: /integrations/web
    schedule:
      interval: weekly
    groups:
      web-dependencies:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: /integrations/wasm-lite
    schedule:
      interval: weekly
    groups:
      wasm-lite-dependencies:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: /integrations/walktest
    schedule:
      interval: weekly
    groups:
      walktest-dependencies:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: /examples/quickstart
    schedule:
      interval: weekly
    groups:
      quickstart-dependencies:
        patterns:
          - "*"
