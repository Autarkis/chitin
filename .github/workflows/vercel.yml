name: Deploy Collider Lab to Vercel

on:
  push:
    branches: [main]
    paths:
      - "examples/quickstart/**"
      - "integrations/**"
      - ".github/workflows/vercel.yml"
  pull_request:
    paths:
      - "examples/quickstart/**"
      - "integrations/**"
      - ".github/workflows/vercel.yml"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: vercel-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      EMSDK_VERSION: "5.0.7"
      COACD_REF: "1.0.11"
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.x"

      - uses: emscripten-core/setup-emsdk@4528d102f7230f0e7b276855c01ea1159be0e984 # v16.0.0
        with:
          version: ${{ env.EMSDK_VERSION }}
          actions-cache-folder: emsdk-cache

      - name: Build CoACD WASM
        working-directory: integrations/wasm
        env:
          COACD_SRC: ${{ runner.temp }}/coacd-src
        run: bash build.sh

      - name: Stage local packages
        run: |
          cp integrations/wasm/dist/coacd.mjs integrations/coacd-wasm/coacd.mjs
          cp integrations/wasm/dist/coacd.wasm integrations/coacd-wasm/coacd.wasm
          ( cd integrations/wasm-lite && npm ci && npm run build )
          ( cd integrations/web && npm ci && npm run build )

      - name: Build Collider Lab
        working-directory: examples/quickstart
        run: |
          npm ci
          npm run build

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Deploy to Vercel
        id: deploy
        run: |
          ARGS="--token=${{ secrets.VERCEL_TOKEN }} --yes"
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/main" ]; then
            ARGS="$ARGS --prod"
          fi
          url=$(vercel deploy examples/quickstart/dist $ARGS 2>&1 | grep -oE 'https://[^ ]+\.vercel\.app' | tail -1)
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed to: $url"

      - name: Comment preview URL on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `🔬 **Collider Lab preview:** ${{ steps.deploy.outputs.url }}`
            })
