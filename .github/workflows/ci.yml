name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Keep the gate reportable on every PR while skipping unrelated WASM builds.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      wasm: ${{ steps.filter.outputs.wasm }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - id: filter
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          # Outside a PR (push to main, manual dispatch) there is no diff to
          # scope by, so build everything.
          if [ -z "$BASE" ]; then
            echo "wasm=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only "$BASE"...HEAD | grep -qE \
            '^(integrations/(wasm|coacd-wasm|wasm-lite|web|walktest)/|examples/quickstart/|\.github/workflows/ci\.yml$)'; then
            echo "wasm=true" >> "$GITHUB_OUTPUT"
          else
            echo "wasm=false" >> "$GITHUB_OUTPUT"
          fi

  python:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # The open3d/OpenMP hangs this suite has hit block for the full 6h default.
    timeout-minutes: 30
    env:
      # Avoid open3d/OpenMP deadlocks on two-core runners.
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      PYTHONFAULTHANDLER: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      - name: Test
        run: pytest -v

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        package:
          - integrations/web
          - integrations/wasm-lite
    defaults:
      run:
        working-directory: ${{ matrix.package }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20.x"
          cache: npm
          cache-dependency-path: ${{ matrix.package }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  wasm:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: changes
    if: needs.changes.outputs.wasm == 'true'
    env:
      EMSDK_VERSION: "5.0.7"
      COACD_REF: "1.0.11"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.x"

      - name: Set up Emscripten
        uses: emscripten-core/setup-emsdk@4528d102f7230f0e7b276855c01ea1159be0e984 # v16.0.0
        with:
          version: ${{ env.EMSDK_VERSION }}
          actions-cache-folder: emsdk-cache

      - name: Verify toolchain
        run: |
          emcc --version
          cmake --version

      - name: Build CoACD WASM
        working-directory: integrations/wasm
        env:
          COACD_SRC: ${{ runner.temp }}/coacd-src
        run: bash build.sh

      - name: Functional test (native binding under Node)
        working-directory: integrations/wasm
        run: node test/decompose.test.mjs

      - name: Build TS wrappers + end-to-end gate (lite -> wasm -> writePhys -> web)
        run: |
          ( cd integrations/wasm-lite && npm ci && npm run build )
          ( cd integrations/web && npm ci && npm run build )
          node integrations/wasm/test/wrapper.test.mjs

      - name: Size-band gate
        working-directory: integrations/wasm
        run: |
          wasm=$(wc -c < dist/coacd.wasm)
          mjs=$(wc -c < dist/coacd.mjs)
          echo "coacd.wasm=${wasm} bytes  coacd.mjs=${mjs} bytes"
          if [ "$wasm" -lt 400000 ] || [ "$wasm" -gt 800000 ]; then
            echo "::error::coacd.wasm size ${wasm} outside [400000, 800000]"; exit 1
          fi
          if [ "$mjs" -lt 40000 ] || [ "$mjs" -gt 200000 ]; then
            echo "::error::coacd.mjs size ${mjs} outside [40000, 200000]"; exit 1
          fi

      - name: Install release-candidate browser harness
        working-directory: integrations/walktest
        run: npm ci

      - name: Stage packed release candidate
        working-directory: integrations/walktest
        run: |
          npm run prepare:release-candidate
          npm run build:release-candidate
          npx playwright install --with-deps chromium firefox webkit

      - name: Packed-package browser gate
        working-directory: integrations/walktest
        run: npx playwright test tests/release-candidate.spec.ts

      - name: Build and test Collider Lab
        working-directory: examples/quickstart
        run: |
          npm ci
          npm run build
          npm test

      - name: Upload build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coacd-wasm
          path: |
            integrations/wasm/dist/coacd.mjs
            integrations/wasm/dist/coacd.wasm
          if-no-files-found: error

  dependency-review:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          # Preserve the repository's published license boundary.
          deny-licenses: GPL-2.0, GPL-3.0, AGPL-3.0, LGPL-3.0

  conventions:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20.x"

      - name: Generated contracts are current
        run: |
          node scripts/gen-contracts.mjs
          git diff --exit-code -- \
            src/chitin/_metric_names.py \
            src/chitin/_shared_constants.py \
            integrations/wasm-lite/src/metric-names.ts \
            integrations/wasm-lite/src/report-schema-constants.ts \
            integrations/wasm-lite/src/shared-constants.ts

      - name: PR title is scoped
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.user.login != 'dependabot[bot]' &&
          github.event.pull_request.user.login != 'github-advanced-security[bot]'
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          # Same shape as the commit history: "scope: imperative subject".
          if ! printf '%s' "$TITLE" | grep -qE '^[a-z0-9-]+: .+'; then
            echo "PR title must be '<scope>: <subject>', got: $TITLE" >&2
            echo "e.g. 'sweep: enforce capsule clearance' or 'docs: fix the flag table'" >&2
            exit 1
          fi
          if [ ${#TITLE} -gt 72 ]; then
            echo "PR title is ${#TITLE} chars; keep it under 72" >&2
            exit 1
          fi

      - name: No internal roadmap docs
        run: |
          # docs/plan-*.md were working notes, removed once the repo went
          # public. Catch a reintroduction before it lands.
          if git ls-files 'docs/plan-*.md' | grep -q .; then
            echo "docs/plan-*.md are internal working notes; keep them out of the repo" >&2
            git ls-files 'docs/plan-*.md' >&2
            exit 1
          fi

  # Stable branch-protection target for the jobs above.
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [changes, python, web, wasm, dependency-review, conventions]
    if: always()
    steps:
      - name: Check job results
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS"
          echo "$RESULTS" | python3 -c '
          import json, sys
          needs = json.load(sys.stdin)
          bad = {n: j["result"] for n, j in needs.items()
                 if j["result"] not in ("success", "skipped")}
          for name, result in sorted(bad.items()):
              print(f"::error::{name}: {result}")
          sys.exit(1 if bad else 0)
          '
