name: CI

# Everything a pull request must pass lives in this one workflow, because
# `needs:` cannot reach across workflow files: a gate job can only aggregate
# its own workflow's jobs. Splitting the checks up would mean branch protection
# had to name each one, and a path-filtered check named directly never reports
# on an unrelated PR -- which blocks the merge forever rather than allowing it.
on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

# Least privilege: nothing here writes to the repo. Forks get a read-only
# token anyway, but this pins it for pushes to main too.
permissions:
  contents: read

# A new push to a PR makes the in-flight run obsolete; don't pay for it.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Scopes the expensive WASM build to PRs that can actually affect it. This is
  # a job-level skip rather than a workflow-level `paths:` filter so the gate
  # below still reports on every PR.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      wasm: ${{ steps.filter.outputs.wasm }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: filter
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          # Outside a PR (push to main, manual dispatch) there is no diff to
          # scope by, so build everything.
          if [ -z "$BASE" ]; then
            echo "wasm=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only "$BASE"...HEAD | grep -qE \
            '^(integrations/(wasm|coacd-wasm|wasm-lite|web)/|\.github/workflows/ci\.yml$)'; then
            echo "wasm=true" >> "$GITHUB_OUTPUT"
          else
            echo "wasm=false" >> "$GITHUB_OUTPUT"
          fi

  python:
    runs-on: ubuntu-latest
    # The open3d/OpenMP hangs this suite has hit block for the full 6h default.
    timeout-minutes: 30
    env:
      # Single-thread OpenMP/BLAS: the suspected hang is an open3d/OpenMP
      # deadlock on the 2-core runner. Harmless if that isn't the cause.
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      # Dump native + Python stacks on a fatal signal so a hang is diagnosable.
      PYTHONFAULTHANDLER: "1"
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      - name: Test
        run: pytest -v

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        package:
          - integrations/web
          - integrations/wasm-lite
    defaults:
      run:
        working-directory: ${{ matrix.package }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20.x"
          cache: npm
          cache-dependency-path: ${{ matrix.package }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  # Builds CoACD to WASM and runs the end-to-end chain through it. No publish
  # authority; releases go through release-wasm.yml.
  wasm:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: changes
    if: needs.changes.outputs.wasm == 'true'
    env:
      EMSDK_VERSION: "5.0.7"
      COACD_REF: "1.0.11"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22.x"

      - name: Set up Emscripten
        uses: emscripten-core/setup-emsdk@v16
        with:
          version: ${{ env.EMSDK_VERSION }}
          actions-cache-folder: emsdk-cache

      - name: Verify toolchain
        run: |
          emcc --version
          cmake --version

      - name: Build CoACD WASM
        working-directory: integrations/wasm
        env:
          COACD_SRC: ${{ runner.temp }}/coacd-src
        run: bash build.sh

      - name: Functional test (native binding under Node)
        working-directory: integrations/wasm
        run: node test/decompose.test.mjs

      - name: Build TS wrappers + end-to-end gate (lite -> wasm -> writePhys -> web)
        run: |
          ( cd integrations/wasm-lite && npm ci && npm run build )
          ( cd integrations/web && npm ci && npm run build )
          node integrations/wasm/test/wrapper.test.mjs

      - name: Size-band gate
        working-directory: integrations/wasm
        run: |
          wasm=$(wc -c < dist/coacd.wasm)
          mjs=$(wc -c < dist/coacd.mjs)
          echo "coacd.wasm=${wasm} bytes  coacd.mjs=${mjs} bytes"
          if [ "$wasm" -lt 400000 ] || [ "$wasm" -gt 800000 ]; then
            echo "::error::coacd.wasm size ${wasm} outside [400000, 800000]"; exit 1
          fi
          if [ "$mjs" -lt 40000 ] || [ "$mjs" -gt 200000 ]; then
            echo "::error::coacd.mjs size ${mjs} outside [40000, 200000]"; exit 1
          fi

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: coacd-wasm
          path: |
            integrations/wasm/dist/coacd.mjs
            integrations/wasm/dist/coacd.wasm
          if-no-files-found: error

  # What the diff brings in. Only meaningful on a PR (it compares against the
  # base), so it skips elsewhere and the gate treats that skip as a pass.
  dependency-review:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
      - name: Review dependency changes
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
          # This repo ships MIT and vendors licence notices for CoACD (MIT) and
          # CDT (MPL-2.0); a copyleft dependency would break that promise.
          deny-licenses: GPL-2.0, GPL-3.0, AGPL-3.0, LGPL-3.0

  conventions:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: PR title is scoped
        if: github.event_name == 'pull_request'
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          # Same shape as the commit history: "scope: imperative subject".
          if ! printf '%s' "$TITLE" | grep -qE '^[a-z0-9-]+: .+'; then
            echo "PR title must be '<scope>: <subject>', got: $TITLE" >&2
            echo "e.g. 'sweep: enforce capsule clearance' or 'docs: fix the flag table'" >&2
            exit 1
          fi
          if [ ${#TITLE} -gt 72 ]; then
            echo "PR title is ${#TITLE} chars; keep it under 72" >&2
            exit 1
          fi

      - name: No internal roadmap docs
        run: |
          # docs/plan-*.md were working notes, removed once the repo went
          # public. Catch a reintroduction before it lands.
          if git ls-files 'docs/plan-*.md' | grep -q .; then
            echo "docs/plan-*.md are internal working notes; keep them out of the repo" >&2
            git ls-files 'docs/plan-*.md' >&2
            exit 1
          fi

  # One stable check name for branch protection to require. Jobs can be added
  # or renamed above without touching the repo's protection rules.
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [changes, python, web, wasm, dependency-review, conventions]
    if: always()
    steps:
      - name: Check job results
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          # A job that skipped on purpose -- the WASM build on a PR that can't
          # affect it, or a PR-only check on a push -- is not a failure. Every
          # other non-success is.
          echo "$RESULTS"
          echo "$RESULTS" | python3 -c '
          import json, sys
          needs = json.load(sys.stdin)
          bad = {n: j["result"] for n, j in needs.items()
                 if j["result"] not in ("success", "skipped")}
          for name, result in sorted(bad.items()):
              print(f"::error::{name}: {result}")
          sys.exit(1 if bad else 0)
          '
