name: Release CoACD WASM

# On a wasm-v* tag: build, attach to the release, and publish to npm via OIDC.
on:
  push:
    tags:
      - "wasm-v*"

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    environment: npm-publish
    env:
      EMSDK_VERSION: "5.0.7"
      COACD_REF: "1.0.11"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          registry-url: "https://registry.npmjs.org"

      - name: Validate tag matches package version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#wasm-v}"
          PKG_VERSION=$(node -p "require('./integrations/coacd-wasm/package.json').version")
          echo "tag=${TAG_VERSION} package=${PKG_VERSION}"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::tag version (${TAG_VERSION}) does not match package.json (${PKG_VERSION})"; exit 1
          fi

      - name: Set up Emscripten
        uses: mymindstorm/setup-emsdk@v16
        with:
          version: ${{ env.EMSDK_VERSION }}
          actions-cache-folder: emsdk-cache

      - name: Build CoACD WASM
        working-directory: integrations/wasm
        env:
          COACD_SRC: ${{ runner.temp }}/coacd-src
        run: bash build.sh

      - name: Functional test (native binding under Node)
        working-directory: integrations/wasm
        run: node test/decompose.test.mjs

      - name: Build TS wrappers + end-to-end gate (lite -> wasm -> writePhys -> web)
        run: |
          ( cd integrations/wasm-lite && npm ci && npm run build )
          ( cd integrations/web && npm ci && npm run build )
          node integrations/wasm/test/wrapper.test.mjs

      - name: Size-band gate
        working-directory: integrations/wasm
        run: |
          wasm=$(wc -c < dist/coacd.wasm)
          mjs=$(wc -c < dist/coacd.mjs)
          echo "coacd.wasm=${wasm} bytes  coacd.mjs=${mjs} bytes"
          if [ "$wasm" -lt 400000 ] || [ "$wasm" -gt 800000 ]; then
            echo "::error::coacd.wasm size ${wasm} outside [400000, 800000]"; exit 1
          fi
          if [ "$mjs" -lt 40000 ] || [ "$mjs" -gt 200000 ]; then
            echo "::error::coacd.mjs size ${mjs} outside [40000, 200000]"; exit 1
          fi

      - name: Stage npm package
        run: cp integrations/wasm/dist/coacd.mjs integrations/wasm/dist/coacd.wasm integrations/coacd-wasm/

      - name: Attach to GitHub Release
        uses: softprops/action-gh-release@v3.0.2
        with:
          files: |
            integrations/wasm/dist/coacd.mjs
            integrations/wasm/dist/coacd.wasm

      - name: Publish to npm
        working-directory: integrations/coacd-wasm
        run: |
          npm install -g npm@latest
          npm publish --access public
