name: Deploy Collider Lab to Pages

# Manual only. Builds the demo from this checkout; it does not require the npm
# packages to be public. Run it only when the current demo is ready to expose.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      EMSDK_VERSION: "5.0.7"
      COACD_REF: "1.0.11"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.x"

      - uses: emscripten-core/setup-emsdk@4528d102f7230f0e7b276855c01ea1159be0e984 # v16.0.0
        with:
          version: ${{ env.EMSDK_VERSION }}
          actions-cache-folder: emsdk-cache

      - name: Build CoACD WASM
        working-directory: integrations/wasm
        env:
          COACD_SRC: ${{ runner.temp }}/coacd-src
        run: bash build.sh

      - name: Stage local packages
        run: |
          cp integrations/wasm/dist/coacd.mjs integrations/coacd-wasm/coacd.mjs
          cp integrations/wasm/dist/coacd.wasm integrations/coacd-wasm/coacd.wasm
          ( cd integrations/wasm-lite && npm ci && npm run build )
          ( cd integrations/web && npm ci && npm run build )

      - name: Build Collider Lab
        working-directory: examples/quickstart
        run: |
          npm ci
          npm run build

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: examples/quickstart/dist
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
