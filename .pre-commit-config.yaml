# Install with: `pip install -e ".[dev]" && pre-commit install`
# We enforce ruff only (lint + format); type checking is intentionally not gated.
#
# The ruff `rev` below MUST match the pinned `ruff==` in pyproject.toml's `dev`
# extra. pre-commit resolves ruff from this tag in its own isolated env, while CI
# resolves it from the dev extra; if the two drift, the formatter styles can
# disagree and a commit that passes the hook still fails `ruff format --check` in
# CI. When running `pre-commit autoupdate`, update pyproject.toml to match.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.4
    hooks:
      # `ruff-check`, not the deprecated `ruff` alias, which warns on every run.
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
  # The web packages have no linter or formatter — their CI gate is `npm test`
  # (vitest) plus `npm run build` (tsc). Each hook is scoped by `files:` to its
  # own package, so a Python-only commit never pays for Node, and a change to one
  # package doesn't run the other's suite.
  - repo: local
    hooks:
      - id: web-gate
        name: chitin-web (vitest + tsc)
        entry: python scripts/npm_gate.py integrations/web
        language: system
        files: ^integrations/web/
        pass_filenames: false

      - id: wasm-lite-gate
        name: chitin-lite (vitest + tsc)
        entry: python scripts/npm_gate.py integrations/wasm-lite
        language: system
        files: ^integrations/wasm-lite/
        pass_filenames: false

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
